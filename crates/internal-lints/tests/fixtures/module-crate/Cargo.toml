# A fixture crate for the private-item lint: its unit tests reach the private
# items of the module they are written in, of the module they are nested in,
# of a sibling module and of the crate root.
#
# The lint must report the sibling module and the crate root, and leave the
# other two alone.
#
# The fixture is never compiled: some of its reaches the compiler would
# refuse. The lint reads it as text.
[package]
name = "module-crate-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, so the fixture stays out of the Aether workspace.
[workspace]
