# A fixture crate for the private-item lint: its integration test imports a
# private item of the crate under test, which the lint must report.
#
# The fixture is never compiled: its integration test imports a private item,
# which the compiler would refuse. The lint reads it as text.
[package]
name = "importing-crate-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, so the fixture stays out of the Aether workspace.
[workspace]
